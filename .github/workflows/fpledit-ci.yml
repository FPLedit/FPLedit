name: fpledit-ci
on:
  push:
    branches: [main,develop]
  release:
    types: [published]
jobs:
  build:
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: 8.0.x

      - name: Setup podman
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install podman

      - name: Set beta build type
        if: ${{ github.event_name != 'release' || github.event.release.prerelease }}
        run: |
          echo "FPLEDIT_GIT_BETA=1" >> $GITHUB_ENV

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build
        run: dotnet cake --rid=linux-x64,osx-x64,win-x64,win-x86
        env:
          FPLEDIT_GIT: ${{ github.sha }}
          FPLEDIT_DOK_PDF: ./Dokumentation.pdf

      - name: Upload zip
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: FPLedit Testversion
          path: |
            ./bin/fpledit-*-linux-*.zip
            ./bin/fpledit-*-osx-*.zip
            ./bin/fpledit-*-win-*.zip
            ./bin/fpledit-*.sha256sums
          if-no-files-found: error
          compression-level: 0 # no compression

      - name: Upload api-doc
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: fpledit-api-doc
          path: ./bin/api-doc/
